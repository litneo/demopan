weight:800;color:var(--teal);margin:13px 0}.full{width:100%}.empty{padding:25px;text-align:center;color:var(--muted)}.notice{padding:12px 15px;background:#e9f4f2;border-radius:9px;color:#276762;font-size:13px;margin-bottom:16px}.modal{position:fixed;inset:0;background:#102b4266;z-index:20;display:grid;place-items:center;padding:16px}.modal>.card{width:min(650px,100%);max-height:90vh;overflow:auto}.toast{position:fixed;bottom:20px;right:20px;background:var(--nav);color:white;padding:14px 20px;border-radius:10px;z-index:30;box-shadow:0 5px 25px #0003;max-width:90vw}.mobile{display:none}.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{padding:7px 10px;font-size:13px}.flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.flow span{padding:10px;background:#eef4f5;border-radius:8px;font-weight:600}.rank{height:7px;background:#e8eff1;border-radius:7px;margin-top:7px}.rank div{height:100%;background:var(--teal);border-radius:7px}.right{text-align:right}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.salegrid{grid-template-columns:1fr}.products{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:720px){aside{transform:translateX(-100%);transition:.2s}aside.open{transform:none;box-shadow:0 0 0 100vw #0005}main{margin:0}.mobile{display:inline-block}header{padding:12px 14px}.content{padding:15px}.grid{gap:10px}.card{padding:14px}.metric strong{font-size:23px}.top{align-items:flex-start;flex-direction:column}h1{font-size:25px}.products{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:1fr}.tag{font-size:10px}header strong{font-size:14px}}@media print{aside,header,button,.toolbar{display:none!important}main{margin:0}.content{padding:0}.card{box-shadow:none}body{background:white}}

'use strict';const $=id=>document.getElementById(id),app=$('app'),side=$('side');const money=n=>'Bs. '+Number(n).toLocaleString('es-BO',{minimumFractionDigits:2,maximumFractionDigits:2});const today=()=>new Date().toLocaleDateString('en-CA');const day=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const stamp=()=>new Date().toLocaleString('es-BO');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let products, suppliers, purchases, movements, orders, cart, cash, expenses, page='dashboard', category='Todos', reportType='Ventas', search='', selectedKardex=1, seq=4;
function init(){products=[{id:1,name:'Pan francés',cat:'Panes',emoji:'🥖',cost:.45,price:1,stock:180,min:25},{id:2,name:'Pan integral',cat:'Panes',emoji:'🍞',cost:1.1,price:2.5,stock:64,min:15},{id:3,name:'Marraqueta',cat:'Panes',emoji:'🥖',cost:.55,price:1.5,stock:92,min:20},{id:4,name:'Croissant',cat:'Bollería',emoji:'🥐',cost:2.5,price:5,stock:32,min:10},{id:5,name:'Empanada de queso',cat:'Bollería',emoji:'🥟',cost:2.2,price:5,stock:28,min:10},{id:6,name:'Queque de naranja',cat:'Pastelería',emoji:'🍰',cost:4,price:8,stock:8,min:10},{id:7,name:'Rosca dulce',cat:'Pastelería',emoji:'🍩',cost:1.8,price:4,stock:25,min:8},{id:8,name:'Café',cat:'Bebidas',emoji:'☕',cost:2,price:5,stock:45,min:10}];suppliers=[{id:1,name:'Distribuidora El Trigal',nit:'1020304012',phone:'70000001'},{id:2,name:'Panificadora San José',nit:'2030405013',phone:'70000002'}];purchases=[{id:'C-001',date:day(),supplier:1,type:'Contado',items:[{id:1,qty:200,cost:.45},{id:2,qty:70,cost:1.1}]},{id:'C-002',date:day(),supplier:2,type:'Por pagar',items:[{id:4,qty:40,cost:2.5}]}];orders=[{id:'V-001',date:day(),time:'08:15',seller:'Ana',client:'Mostrador',items:[{id:1,qty:20,price:1,cost:.45},{id:4,qty:8,price:5,cost:2.5}],status:'Cobrado',pay:'Efectivo',received:60},{id:'V-002',date:day(),time:'09:20',seller:'Luis',client:'Mostrador',items:[{id:2,qty:6,price:2.5,cost:1.1},{id:5,qty:4,price:5,cost:2.2}],status:'Cobrado',pay:'QR',received:35},{id:'V-003',date:day(),time:'10:05',seller:'Ana',client:'Pedido 03',items:[{id:3,qty:4,price:1.5,cost:.55},{id:7,qty:2,price:4,cost:1.8}],status:'Pendiente',pay:''}];movements=[];products.forEach(p=>{let bought=purchases.flatMap(x=>x.items).filter(x=>x.id===p.id).reduce((a,x)=>a+x.qty,0),sold=orders.filter(o=>o.status==='Cobrado').flatMap(o=>o.items).filter(x=>x.id===p.id).reduce((a,x)=>a+x.qty,0);let opening=p.stock-bought+sold;if(opening>0)movements.push({id:p.id,date:day(),time:'07:00',type:'Ingreso',ref:'Saldo inicial',qty:opening,cost:p.cost});purchases.forEach(c=>c.items.filter(x=>x.id===p.id).forEach(x=>movements.push({id:p.id,date:day(),time:'07:30',type:'Ingreso',ref:c.id,qty:x.qty,cost:x.cost})));orders.filter(o=>o.status==='Cobrado').forEach(o=>o.items.filter(x=>x.id===p.id).forEach(x=>movements.push({id:p.id,date:day(),time:o.time,type:'Salida',ref:o.id,qty:-x.qty,cost:x.cost})));});cart=[];cash={open:true,base:200};expenses=[];seq=4;category='Todos';search='';selectedKardex=1;reportType='Ventas'}init();const prod=id=>products.find(p=>p.id===Number(id));const supplier=id=>suppliers.find(p=>p.id===Number(id));const total=o=>o.items.reduce((a,x)=>a+x.qty*(x.price??x.cost),0);const paid=()=>orders.filter(o=>o.status==='Cobrado');const sum=(arr,fn)=>arr.reduce((a,x)=>a+fn(x),0);const pending=()=>orders.filter(o=>o.status==='Pendiente');const avail=id=>prod(id).stock-sum(pending(),o=>sum(o.items.filter(x=>x.id===id),x=>x.qty));const time=()=>new Date().toLocaleTimeString('es-BO',{hour:'2-digit',minute:'2-digit'});const menu=[['dashboard','▦','Dashboard'],['inventario','▤','Inventario'],['kardex','↕','Kardex e historial'],['compras','↓','Compras'],['proveedores','♙','Proveedores'],['ventas','＋','Ventas móviles'],['caja','▣','Caja y cobranzas'],['historial','◷','Historial de ventas'],['reportes','▥','Reportería']];function go(p){page=p;search='';side.classList.remove('open');render()}function render(){ $('nav').innerHTML=menu.map(([id,ico,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span>${ico}</span>${label}${id==='caja'&&pending().length?' · '+pending().length:''}</button>`).join('');app.innerHTML=({dashboard,inventario,kardex,compras,proveedores,ventas,caja,historial,reportes}[page])();}function title(t,s,a=''){return `<div class="top"><div><h1>${t}</h1><p>${s}</p></div>${a}</div>`}function metric(l,v,s){return `<div class="card metric"><small>${l}</small><strong>${v}</strong><em>${s}</em></div>`}function table(head,rows){return `<div class="tablewrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${head.length}" class="empty">No hay registros</td></tr>`}</tbody></table></div>`}function notify(t){$('toasts').innerHTML=`<div class="toast">${esc(t)}</div>`;setTimeout(()=>$('toasts').innerHTML='',3000)}function modal(t,body){$('overlay').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="card"><div class="top"><h2>${t}</h2><button class="secondary" onclick="closeModal()">✕</button></div>${body}</div></div>`}function closeModal(){$('overlay').innerHTML=''}function resetDemo(){if(confirm('¿Reiniciar todos los datos de demostración?')){init();go('dashboard');notify('Demostración reiniciada')}}function searchBox(ph){return `<input id="query" placeholder="${ph}" value="${esc(search)}" oninput="search=this.value;let pos=this.selectionStart;render();$('query').focus();$('query').setSelectionRange(pos,pos)">`}function match(s){return String(s).toLowerCase().includes(search.toLowerCase())}function status(s){return `<span class="pill ${s==='Pendiente'||s==='Por pagar'?'warn':s==='Anulado'?'bad':''}">${esc(s)}</span>`}function dashboard(){let p=paid(),v=sum(p,total),qr=sum(p.filter(o=>o.pay==='QR'),total),ef=v-qr;let ranks=products.map(x=>({name:x.name,qty:sum(p,o=>sum(o.items.filter(i=>i.id===x.id),i=>i.qty))})).sort((a,b)=>b.qty-a.qty).slice(0,5);let vals=[145,220,180,290,245,310,v];return title('Dashboard gerencial','Visión integral de las operaciones · '+day(),'<button onclick="go(\'ventas\')">+ Nueva venta</button>')+`<div class="grid">${metric('Ventas cobradas',money(v),p.length+' transacciones de hoy')}${metric('Pedidos pendientes',pending().length,money(sum(pending(),total))+' por cobrar')}${metric('Existencias',sum(products,p=>p.stock)+' uds.',products.length+' productos activos')}${metric('Valor del inventario',money(sum(products,p=>p.stock*p.cost)),'Valorizado al costo')}</div><div class="grid two section"><div class="card"><h2>Comportamiento de ventas</h2><div class="muted">Últimos 7 días · histórico ilustrativo</div><div class="bars">${vals.map((v,i)=>`<div class="barcol"><b>${v.toFixed(0)}</b><div class="bar" style="height:${v/Math.max(...vals)*85}%"></div><small>${['-6 d','-5 d','-4 d','-3 d','-2 d','Ayer','Hoy'][i]}</small></div>`).join('')}</div></div><div class="card"><h2>Métodos de pago · hoy</h2><div class="line"><span>▣ Efectivo</span><strong>${money(ef)}</strong></div><div class="line"><span>▦ QR</span><strong>${money(qr)}</strong></div><div class="rank" style="height:14px"><div style="width:${v?ef/v*100:0}%"></div></div><p>${p.filter(o=>o.pay==='Efectivo').length} cobros en efectivo · ${p.filter(o=>o.pay==='QR').length} QR</p><button class="secondary" onclick="go('caja')">Ver caja central</button></div></div><div class="grid two section"><div class="card"><h2>Productos más vendidos</h2>${ranks.map(r=>`<div class="line"><div style="flex:1">${esc(r.name)}<div class="rank"><div style="width:${r.qty/(ranks[0].qty||1)*100}%"></div></div></div><strong>${r.qty} uds.</strong></div>`).join('')}</div><div class="card"><h2>Alertas de inventario</h2>${products.filter(p=>p.stock<=p.min).map(p=>`<div class="line">${p.emoji} ${esc(p.name)} <span class="pill warn">${p.stock} restantes</span></div>`).join('')||'<p>Sin alertas</p>'}<h2 style="margin-top:22px">Flujo de atención</h2><div class="flow"><span>📱 Pedido</span> → <span>▣ Caja</span> → <span>✓ Cobrado</span></div></div></div>`}
function inventario(){return title('Inventario','Control de productos, precios y existencias.','<button onclick="productForm()">+ Nuevo producto</button>')+`<div class="card"><div class="toolbar">${searchBox('Buscar producto…')}<button class="secondary" onclick="go('kardex')">Ver Kardex</button></div>${table(['Código','Producto','Categoría','Costo','Precio','Stock','Estado','Acciones'],products.filter(p=>match(p.name+' '+p.cat+' '+p.id)).map(p=>['P-'+String(p.id).padStart(3,'0'),p.emoji+' '+esc(p.name),esc(p.cat),money(p.cost),money(p.price),p.stock,status(p.stock<=p.min?'Pendiente':'Disponible'),`<div class="actions"><button class="secondary" onclick="productForm(${p.id})">Editar</button><button class="secondary" onclick="adjust(${p.id})">Movimiento</button><button class="secondary" onclick="selectedKardex=${p.id};go('kardex')">Kardex</button></div>`]))}</div>`}function productForm(id){let p=id?prod(id):{name:'',cat:'Panes',cost:0,price:0,min:10,emoji:'🍞'};modal(id?'Editar producto':'Nuevo producto',`<form onsubmit="saveProduct(event,${id||0})"><label>Nombre<input name="name" required value="${esc(p.name)}"></label><div class="formgrid"><label>Categoría<input name="cat" required value="${esc(p.cat)}"></label><label>Icono<input name="emoji" value="${esc(p.emoji)}"></label><label>Costo (Bs.)<input name="cost" type="number" min="0" step=".01" required value="${p.cost}"></label><label>Precio (Bs.)<input name="price" type="number" min=".01" step=".01" required value="${p.price}"></label><label>Stock mínimo<input name="min" type="number" min="0" required value="${p.min}"></label></div><button>Guardar producto</button></form>`)}function saveProduct(e,id){e.preventDefault();let f=new FormData(e.target),x={name:f.get('name').trim(),cat:f.get('cat').trim(),emoji:f.get('emoji')||'🍞',cost:+f.get('cost'),price:+f.get('price'),min:+f.get('min')};if(!x.name||!x.cat)return;if(id)Object.assign(prod(id),x);else products.push({...x,id:Math.max(0,...products.map(p=>p.id))+1,stock:0});closeModal();render();notify('Producto guardado')}function move(id,qty,type,ref,cost){let p=prod(id);p.stock+=qty;movements.push({id,date:day(),time:time(),type,ref,qty,cost:cost??p.cost})}function adjust(id){modal('Movimiento · '+esc(prod(id).name),`<form onsubmit="saveAdjust(event,${id})"><label>Tipo<select name="type"><option>Ingreso</option><option>Salida</option><option>Merma</option></select></label><label>Cantidad<input name="qty" type="number" min="1" required></label><label>Motivo / referencia<input name="ref" required></label><button>Registrar movimiento</button></form>`)}function saveAdjust(e,id){e.preventDefault();let f=new FormData(e.target),q=+f.get('qty'),t=f.get('type');if(t!=='Ingreso'&&q>avail(id))return notify('Cantidad superior al stock disponible');move(id,t==='Ingreso'?q:-q,t,f.get('ref'));closeModal();render();notify('Movimiento registrado')}
function kardex(){let p=prod(selectedKardex),bal=0;return title('Kardex e historial','Trazabilidad de ingresos, salidas y ajustes por producto.')+`<div class="card"><div class="toolbar"><label>Producto<select onchange="selectedKardex=+this.value;render()">${products.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><div class="total" style="margin-left:auto">${p.stock} uds.</div></div>${table(['Fecha','Hora','Movimiento','Referencia','Ingreso','Salida','Saldo','Costo unit.'],movements.filter(m=>m.id===p.id).map(m=>{bal+=m.qty;return[m.date,m.time,m.type,esc(m.ref),m.qty>0?m.qty:'—',m.qty<0?-m.qty:'—',bal,money(m.cost)]}))}</div>`}
function proveedores(){return title('Proveedores','Directorio e historial de abastecimiento.','<button onclick="supplierForm()">+ Nuevo proveedor</button>')+`<div class="card"><div class="toolbar">${searchBox('Buscar proveedor…')}</div>${table(['Razón social','NIT','Teléfono','Compras','Por pagar','Acciones'],suppliers.filter(s=>match(s.name+' '+s.nit)).map(s=>[esc(s.name),esc(s.nit),esc(s.phone),money(sum(purchases.filter(c=>c.supplier===s.id),total)),money(sum(purchases.filter(c=>c.supplier===s.id&&c.type==='Por pagar'),total)),`<div class="actions"><button class="secondary" onclick="supplierForm(${s.id})">Editar</button><button class="secondary" onclick="supplierHistory(${s.id})">Historial</button></div>`]))}</div>`}function supplierForm(id){let s=id?supplier(id):{name:'',nit:'',phone:''};modal('Proveedor',`<form onsubmit="saveSupplier(event,${id||0})"><label>Razón social<input name="name" required value="${esc(s.name)}"></label><label>NIT<input name="nit" value="${esc(s.nit)}"></label><label>Teléfono<input name="phone" value="${esc(s.phone)}"></label><button>Guardar</button></form>`)}function saveSupplier(e,id){e.preventDefault();let f=new FormData(e.target),x=Object.fromEntries(f);if(id)Object.assign(supplier(id),x);else suppliers.push({...x,id:Math.max(...suppliers.map(s=>s.id),0)+1});closeModal();render();notify('Proveedor guardado')}function supplierHistory(id){modal('Historial · '+esc(supplier(id).name),table(['Documento','Fecha','Condición','Total'],purchases.filter(c=>c.supplier===id).map(c=>[c.id,c.date,status(c.type),money(total(c))])))}
function compras(){return title('Compras e ingresos','Registro de mercadería recibida de proveedores.','<div class="actions"><button class="secondary" onclick="importForm()">↑ Importar movimientos</button><button onclick="purchaseForm()">+ Nueva compra</button></div>')+`<div class="grid two"><div class="card metric"><small>Compras registradas</small><strong>${money(sum(purchases,total))}</strong></div><div class="card metric"><small>Cuentas por pagar</small><strong>${money(sum(purchases.filter(c=>c.type==='Por pagar'),total))}</strong></div></div><div class="card section">${table(['Documento','Fecha','Proveedor','Condición','Total','Acciones'],purchases.map(c=>[c.id,c.date,esc(supplier(c.supplier).name),status(c.type),money(total(c)),`<div class="actions"><button class="secondary" onclick="purchaseDetail('${c.id}')">Detalle</button>${c.type==='Por pagar'?`<button onclick="settle('${c.id}')">Marcar pagado</button>`:''}</div>`]))}</div>`}function purchaseDetail(id){let c=purchases.find(c=>c.id===id);modal('Compra '+id,table(['Producto','Cantidad','Costo','Subtotal'],c.items.map(i=>[esc(prod(i.id).name),i.qty,money(i.cost),money(i.qty*i.cost)]))+`<div class="total">${money(total(c))}</div>`)}function settle(id){if(confirm('¿Registrar compra como pagada?')){purchases.find(c=>c.id===id).type='Pagado';render();notify('Compra pagada')}}let buy=[];function purchaseForm(){buy=[];modal('Nueva compra',`<form onsubmit="savePurchase(event)"><div class="formgrid"><label>Proveedor<select name="supplier">${suppliers.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`)}</select></label><label>Condición<select name="type"><option>Contado</option><option>Por pagar</option></select></label></div><div class="formgrid"><label>Producto<select id="bp" onchange="$('bc').value=prod(this.value).cost">${products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`)}</select></label><label>Cantidad<input id="bq" type="number" min="1" value="1"></label><label>Costo unitario<input id="bc" type="number" min="0" step=".01" value="${products[0].cost}"></label><div style="align-self:end"><button type="button" class="secondary" onclick="addBuy()">+ Agregar línea</button></div></div><div id="buylist"></div><button>Confirmar ingreso</button></form>`);drawBuy()}function addBuy(){let id=+$('bp').value,qty=+$('bq').value,cost=+$('bc').value;if(!Number.isInteger(qty)||qty<=0||cost<0||!Number.isFinite(cost))return notify('Revise cantidad y costo');buy.push({id,qty,cost});drawBuy()}function drawBuy(){$('buylist').innerHTML=table(['Producto','Cantidad','Subtotal',''],buy.map((x,i)=>[esc(prod(x.id).name),x.qty,money(x.qty*x.cost),`<button type="button" class="secondary" onclick="buy.splice(${i},1);drawBuy()">×</button>`]))+`<div class="total">${money(sum(buy,x=>x.qty*x.cost))}</div>`}function registerPurchase(s,type,items){let id='C-'+String(purchases.length+1).padStart(3,'0');purchases.push({id,date:day(),supplier:s,type,items});items.forEach(x=>{let p=prod(x.id);p.cost=x.cost;move(x.id,x.qty,'Ingreso',id,x.cost)})}function savePurchase(e){e.preventDefault();if(!buy.length)return notify('Agregue al menos un producto');let f=new FormData(e.target);registerPurchase(+f.get('supplier'),f.get('type'),buy.slice());closeModal();render();notify('Compra registrada e inventario actualizado')}
function download(name,text){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importForm(){modal('Importar ingresos de mercadería',`<div class="notice">Utilice una plantilla CSV compatible con Excel. Columnas: codigo,cantidad,costo. Seleccione un proveedor para todos los movimientos del archivo.</div><form onsubmit="importCSV(event)"><label>Proveedor<select name="supplier">${suppliers.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`)}</select></label><label>Condición<select name="type"><option>Contado</option><option>Por pagar</option></select></label><button type="button" class="secondary" onclick="download('plantilla_ingresos.csv','codigo,cantidad,costo\\nP-001,30,0.45\\nP-002,15,1.10')">Descargar plantilla de ejemplo</button><label>Archivo CSV<input type="file" name="file" accept=".csv,text/csv" required></label><button>Importar y actualizar inventario</button></form>`)}async function importCSV(e){e.preventDefault();let f=new FormData(e.target);try{let raw=(await f.get('file').text()).replace(/^\uFEFF/,'').trim(),lines=raw.split(/\r?\n/),sep=lines[0].includes(';')?';':',';let h=lines.shift().split(sep).map(x=>x.trim().toLowerCase());if(h.join(',')!=='codigo,cantidad,costo')throw Error('Encabezados incorrectos');let items=lines.filter(x=>x.trim()).map((l,i)=>{let [code,q,c]=l.split(sep).map(x=>x.trim().replace(/^"|"$/g,'')),id=Number(code.replace(/^P-/i,'')),qty=Number(q),cost=Number((c||'').replace(',','.'));if(!prod(id)||!Number.isInteger(qty)||qty<=0||!c||cost<0||!Number.isFinite(cost))throw Error('Revise fila '+(i+2));return{id,qty,cost}});if(!items.length)throw Error('Archivo vacío');registerPurchase(+f.get('supplier'),f.get('type'),items);closeModal();render();notify('Importación completada: '+items.length+' líneas')}catch(err){notify(err.message)}}
let seller='Ana',client='';function ventas(){let cats=['Todos',...new Set(products.map(p=>p.cat))];return title('Ventas móviles','Seleccione productos y envíe el pedido a caja.')+`<div class="salegrid"><div class="card"><div class="toolbar">${searchBox('Buscar pan, bebida…')}</div><div class="toolbar">${cats.map(c=>`<button class="${c===category?'':'secondary'}" data-cat="${esc(c)}" onclick="category=this.dataset.cat;render()">${esc(c)}</button>`).join('')}</div><div class="products">${products.filter(p=>(category==='Todos'||p.cat===category)&&match(p.name)).map(p=>`<button class="product" onclick="addCart(${p.id})" ${avail(p.id)<=0?'disabled':''}><i>${esc(p.emoji)}</i><strong>${esc(p.name)}</strong><small>${money(p.price)} · ${avail(p.id)} disp.</small></button>`).join('')}</div></div><div class="card"><h2>Pedido actual <span class="pill">${sum(cart,x=>x.qty)} uds.</span></h2><div class="formgrid"><label>Vendedor<select onchange="seller=this.value"><option ${seller==='Ana'?'selected':''}>Ana</option><option ${seller==='Luis'?'selected':''}>Luis</option><option ${seller==='María'?'selected':''}>María</option></select></label><label>Cliente / referencia<input placeholder="Mostrador" value="${esc(client)}" oninput="client=this.value"></label></div>${cart.length?cart.map(x=>`<div class="line"><div><strong>${esc(prod(x.id).name)}</strong><div class="muted">${money(x.price*x.qty)}</div></div><div class="actions"><button class="secondary" onclick="changeCart(${x.id},-1)">−</button><strong style="align-self:center">${x.qty}</strong><button class="secondary" onclick="changeCart(${x.id},1)">+</button></div></div>`).join(''):'<div class="empty">Agregue productos al pedido.</div>'}<div class="muted" style="margin-top:18px">TOTAL DEL PEDIDO</div><div class="total">${money(sum(cart,x=>x.qty*x.price))}</div><button class="full" ${!cart.length?'disabled':''} onclick="sendOrder()">Enviar pedido a caja →</button><button class="secondary full" style="margin-top:9px" onclick="cart=[];render()">Limpiar pedido</button></div></div>`}function addCart(id){changeCart(id,1)}function changeCart(id,n){let x=cart.find(x=>x.id===id),q=(x?.qty||0)+n;if(q>avail(id))return notify('Stock disponible insuficiente');if(q<=0)cart=cart.filter(x=>x.id!==id);else if(x)x.qty=q;else{let p=prod(id);cart.push({id,qty:q,price:p.price,cost:p.cost})}render()}function sendOrder(){if(!cart.length)return;if(cart.some(x=>x.qty>avail(x.id)))return notify('Revise las existencias disponibles');let id='V-'+String(seq++).padStart(3,'0');orders.push({id,date:day(),time:time(),seller,client:client.trim()||'Mostrador',items:cart.map(x=>({...x})),status:'Pendiente',pay:''});cart=[];client='';render();notify('Pedido '+id+' enviado a caja')}
function caja(){let p=paid(),ef=sum(p.filter(o=>o.pay==='Efectivo'),total),qr=sum(p.filter(o=>o.pay==='QR'),total);return title('Caja y cobranzas','Recepción centralizada de pedidos y control diario.',`<button class="${cash.open?'secondary':''}" onclick="cashForm()">${cash.open?'Cerrar caja':'Abrir caja'}</button>`)+`<div class="grid">${metric('Estado de caja',cash.open?'Abierta':'Cerrada',money(cash.base)+' fondo inicial')}${metric('Efectivo',money(ef),'Ventas cobradas')}${metric('QR',money(qr),'Ventas cobradas')}${metric('Efectivo esperado',money(cash.base+ef),'Fondo + cobros')}</div><div class="card section"><h2>Pedidos pendientes de cobro <span class="pill warn">${pending().length}</span></h2>${table(['Pedido','Hora','Vendedor','Cliente','Total','Acciones'],pending().map(o=>[o.id,o.time,esc(o.seller),esc(o.client),money(total(o)),`<div class="actions"><button class="secondary" onclick="orderDetail('${o.id}')">Detalle</button><button ${!cash.open?'disabled':''} onclick="payForm('${o.id}')">Cobrar</button><button class="danger" onclick="cancelOrder('${o.id}')">Anular</button></div>`]))}</div><div class="card section"><h2>Últimos cobros</h2>${table(['Pedido','Vendedor','Método','Total'],p.slice().reverse().map(o=>[o.id,esc(o.seller),o.pay,money(total(o))]))}</div>`}function payForm(id){let o=orders.find(o=>o.id===id);if(!cash.open||o.status!=='Pendiente')return;modal('Cobrar pedido '+id,`<form onsubmit="payOrder(event,'${id}')"><div class="total">${money(total(o))}</div><label>Método de pago<select name="pay" id="paymethod" onchange="togglePay()"><option>QR</option><option>Efectivo</option></select></label><div id="cashfields" hidden><label>Monto recibido (Bs.)<input id="received" name="received" disabled type="number" min="${total(o).toFixed(2)}" step=".01" oninput="$('change').textContent=money(Math.max(0,+this.value-${total(o)}))"></label><p>Cambio: <strong id="change">${money(0)}</strong></p></div><div class="notice" id="qrnote">Cobro QR simulado. No se realiza ninguna transacción bancaria real.</div><button>Confirmar cobro</button></form>`)}function togglePay(){let e=$('paymethod').value==='Efectivo';$('cashfields').hidden=!e;$('qrnote').hidden=e;$('received').required=e;$('received').disabled=!e}function payOrder(e,id){e.preventDefault();let o=orders.find(o=>o.id===id),f=new FormData(e.target),method=f.get('pay'),amount=method==='Efectivo'?+f.get('received'):total(o);if(!cash.open||o.status!=='Pendiente'||amount+1e-8<total(o))return notify('Verifique el cobro');if(o.items.some(x=>prod(x.id).stock<x.qty))return notify('Stock insuficiente');o.status='Cobrado';o.pay=method;o.received=amount;o.items.forEach(x=>move(x.id,-x.qty,'Salida',o.id,x.cost));closeModal();render();notify('Cobro confirmado · '+id)}function cancelOrder(id){let o=orders.find(o=>o.id===id);if(o.status==='Anulado'||!confirm('¿Anular '+id+'? Si ya fue cobrado se revertirá el inventario y el total de ventas del demo.'))return;if(o.status==='Cobrado')o.items.forEach(x=>move(x.id,x.qty,'Devolución',id,x.cost));o.status='Anulado';render();notify('Pedido anulado')}function cashForm(){if(cash.open){let expected=cash.base+sum(paid().filter(o=>o.pay==='Efectivo'),total);modal('Cierre de caja',`<form onsubmit="closeCash(event,${expected})"><p>Efectivo esperado: <strong>${money(expected)}</strong></p><label>Efectivo contado<input name="count" type="number" min="0" step=".01" required></label><button>Confirmar cierre</button></form>`)}else modal('Apertura de caja',`<form onsubmit="openCash(event)"><label>Fondo inicial (Bs.)<input name="base" type="number" min="0" step=".01" required value="200"></label><div class="notice">Demo de caja diaria: al reabrir se conserva el historial de ventas del día.</div><button>Abrir caja</button></form>`)}function closeCash(e,expected){e.preventDefault();let count=+new FormData(e.target).get('count');cash.open=false;closeModal();render();notify('Caja cerrada. Diferencia: '+money(count-expected))}function openCash(e){e.preventDefault();cash={open:true,base:+new FormData(e.target).get('base')};closeModal();render();notify('Caja abierta')}
let histStatus='Todos';function historial(){let list=orders.filter(o=>(histStatus==='Todos'||o.status===histStatus)&&match(o.id+' '+o.seller+' '+o.client));return title('Historial de ventas','Consulta, detalle y anulación de operaciones.')+`<div class="card"><div class="toolbar">${searchBox('Buscar pedido, vendedor…')}<select onchange="histStatus=this.value;render()">${['Todos','Cobrado','Pendiente','Anulado'].map(x=>`<option ${histStatus===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="muted">${list.length} registros · ${money(sum(list,total))} importe de los registros filtrados</div>${table(['Pedido','Fecha','Vendedor','Cliente','Estado','Pago','Total','Acciones'],list.map(o=>[o.id,o.date,esc(o.seller),esc(o.client),status(o.status),o.pay||'—',money(total(o)),`<div class="actions"><button class="secondary" onclick="orderDetail('${o.id}')">Detalle</button>${o.status!=='Anulado'?`<button class="danger" onclick="cancelOrder('${o.id}')">Anular</button>`:''}</div>`]))}</div>`}function orderDetail(id){let o=orders.find(o=>o.id===id);modal('Detalle · '+id,`<p>${esc(o.seller)} · ${esc(o.client)} · ${status(o.status)}</p>`+table(['Producto','Cantidad','Precio','Subtotal'],o.items.map(i=>[esc(prod(i.id).name),i.qty,money(i.price),money(i.qty*i.price)]))+`<div class="total">${money(total(o))}</div>${o.pay?`<p>Pago: ${o.pay}</p>`:''}<button class="secondary" onclick="printOrder('${id}')">Imprimir comprobante</button>`)}function printOrder(id){let o=orders.find(o=>o.id===id),w=window.open('','_blank');if(!w)return notify('Permita ventanas emergentes para imprimir');w.document.write(`<html><head><title>${id}</title></head><body style="font:16px sans-serif;padding:25px"><h2>OAKSOFT · Panadería Central</h2><p>Comprobante demostrativo ${id} · ${esc(o.status)}</p><p>${o.date} · ${esc(o.client)}</p>${table(['Producto','Cantidad','Subtotal'],o.items.map(x=>[esc(prod(x.id).name),x.qty,money(x.qty*x.price)]))}<h2>${money(total(o))}</h2><p>Sin valor fiscal</p></body></html>`);w.document.close();w.print()}
let reportFrom=day(),reportTo=day();function reportData(){let inRange=x=>x.date>=reportFrom&&x.date<=reportTo,p=paid().filter(inRange);switch(reportType){case 'Productos vendidos':return [['Producto','Cantidad','Importe','Margen estimado'],products.map(x=>{let i=p.flatMap(o=>o.items).filter(i=>i.id===x.id);return[x.name,sum(i,x=>x.qty),money(sum(i,x=>x.qty*x.price)),money(sum(i,x=>x.qty*(x.price-x.cost)))]})];case 'Cobranzas':return [['Método','Transacciones','Importe'],['Efectivo','QR'].map(m=>[m,p.filter(o=>o.pay===m).length,money(sum(p.filter(o=>o.pay===m),total))])];case 'Compras':return [['Documento','Proveedor','Fecha','Condición','Importe'],purchases.filter(inRange).map(c=>[c.id,supplier(c.supplier).name,c.date,c.type,money(total(c))])];case 'Inventario':return [['Producto','Stock actual','Costo','Valor'],products.map(x=>[x.name,x.stock,money(x.cost),money(x.stock*x.cost)])];case 'Movimientos':return [['Fecha','Producto','Tipo','Referencia','Cantidad'],movements.filter(inRange).map(m=>[m.date,prod(m.id).name,m.type,m.ref,m.qty])];case 'Vendedores':return [['Vendedor','Ventas','Importe'],[...new Set(p.map(o=>o.seller))].map(s=>[s,p.filter(o=>o.seller===s).length,money(sum(p.filter(o=>o.seller===s),total))])];default:return [['Pedido','Fecha','Vendedor','Método','Importe'],p.map(o=>[o.id,o.date,o.seller,o.pay,money(total(o))])]}}function reportes(){let [h,r]=reportData();return title('Reportería','Información comercial y operativa para la toma de decisiones.','<div class="actions"><button class="secondary" onclick="exportReport()">Exportar a Excel (CSV)</button><button onclick="window.print()">Imprimir / PDF</button></div>')+`<div class="card"><div class="toolbar"><label>Reporte<select onchange="reportType=this.value;render()">${['Ventas','Productos vendidos','Vendedores','Cobranzas','Compras','Inventario','Movimientos'].map(t=>`<option ${reportType===t?'selected':''}>${t}</option>`).join('')}</select></label><label>Desde<input type="date" value="${reportFrom}" onchange="reportFrom=this.value;render()"></label><label>Hasta<input type="date" value="${reportTo}" onchange="reportTo=this.value;render()"></label></div><h2>${reportType} · ${reportType==='Inventario'?'Existencia actual':reportFrom+' a '+reportTo}</h2>${table(h,r.map(row=>row.map(esc)))}<p>${r.length} registros</p></div>`}function exportReport(){let [h,r]=reportData();download('reporte_'+reportType.replaceAll(' ','_')+'.csv',[h,...r].map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\n'))}render();
</script></body></html>
